name: Build and migrate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gnk
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: gnk
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U gnk -d gnk" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://gnk:ci-only@localhost:5432/gnk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm exec -w backend -- prisma generate
      - run: npm run migrate
      - run: npm run build
